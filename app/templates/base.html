<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JEE Prep Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="nav">
    <div class="nav-brand">JEE Prep Tracker</div>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('topics_list') }}" class="{{ 'active' if request.endpoint in ['topics_list', 'topic_edit'] }}">Topic Tracker</a>
      <a href="{{ url_for('mocks_list') }}" class="{{ 'active' if request.endpoint in ['mocks_list', 'mock_edit'] }}">Mock Tests</a>
      <a href="{{ url_for('milestones_list') }}" class="{{ 'active' if request.endpoint == 'milestones_list' }}">Milestones</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
